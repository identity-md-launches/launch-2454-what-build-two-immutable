[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 128
fail_on_revert = true

[fmt]
line_length = 120
# Preserve the pinned audited files byte-for-byte.
ignore = ["lib/**", "src/store/HookListingRegistry.sol", "src/store/StoreAdmin.sol", "src/store/ExactStoreToken.sol"]
